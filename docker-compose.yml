
services:
  postgres:
    image: postgres:16.2
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data # Named volume for PostgreSQL data
    ports:
      - "5433:5432" # Optional: expose PostgreSQL port
    networks:
      - keycloak_network

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.4
    environment:
      DB_VENDOR: POSTGRES
      DB_ADDR: postgres
      DB_DATABASE: keycloak
      DB_USER: keycloak
      DB_PASSWORD: mysecretpassword
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: adminpassword
      KC_HOSTNAME: localhost # Adjust as needed
      KC_PROXY: edge # Or 'passthrough' depending on your setup
    ports:
      - "8080:8080" # Keycloak HTTP port
      - "8443:8443" # Keycloak HTTPS port (if enabled)
    command: start-dev # For development, use 'start' for production
    depends_on:
      - postgres
    networks:
      - keycloak_network
    # Optional: Mount a volume for importing realms or custom configurations
    # volumes:
    #   - ./imports:/opt/jboss/keycloak/imports 

volumes:
  postgres_data: # Define the named volume for PostgreSQL
    driver: local
  # Optional: Define other named volumes if needed

networks:
  keycloak_network:
    driver: bridge